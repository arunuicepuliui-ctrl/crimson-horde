<style>

html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a07; color: #e8dcc8; font-family: 'Share Tech Mono', ui-monospace, monospace; }
canvas { display: block; cursor: none; }
.hidden { display: none !important; }

#join { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(60,10,6,.55), rgba(5,3,2,.95)); z-index: 10; }
#join .panel { width: min(440px, calc(100vw - 32px)); padding: 32px 28px; background: rgba(18,13,9,.92); border: 1px solid #4a2a1c; box-shadow: 0 0 60px rgba(160,20,10,.25); }

  const BASE_SPEED = 215;
  const PLAYER_R = 14;

    { key: 'rocket',  name: 'Rocket Launcher', tier: 2, rate: 1.25, dmg: 40,  spread: 0.02, pellets: 1, speed: 620,  clip: 5,   reload: 2.1, pierce: 0,  kind: 3, life: 1.6, splash: 120, splashDmg: 110 },
    { key: 'flamer',  name: 'Flamethrower',    tier: 2, rate: 22,   dmg: 5,   spread: 0.22, pellets: 1, speed: 430,  clip: 150, reload: 2.3, pierce: 4,  kind: 4, life: 0.5 },

    { key: 'spitter', hp: 75,   spd: 70,  r: 16, dmg: 10, xp: 6, range: 400, cd: 2.4, pdmg: 12, pspd: 280 },

  ];

  const BONUSES = [
    { key: 'med',    name: 'Medikit',   w: 5,   color: '#e53935' },

  const PERKS = [

  const api = { MAP, BASE_SPEED, PLAYER_R, WEAPONS, ENEMIES, BONUSES, PERKS, xpNeed };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;

<script>
// Game simulation (authoritative). Runs on the Node server for co-op, or inside the browser for solo play.
(function (root) {
'use strict';
const S = typeof module !== 'undefined' && module.exports ? require('./shared.js') : root.SHARED;
const TICK_HZ = 30, DT = 1 / TICK_HZ, SEND_EVERY = 2; // sim 30 Hz, snapshots 15 Hz
const MAX_PLAYERS = 8, MAX_ENEMIES = 360, MAX_BULLETS = 800, MAX_PICKUPS = 30;
const { MAP, PLAYER_R, BASE_SPEED } = S;
const COLORS = ['#4fc3f7', '#ffb74d', '#aed581', '#f06292', '#ba68c8', '#fff176', '#4db6ac', '#e57373'];
const BI = Object.fromEntries(S.BONUSES.map((b, i) => [b.key, i]));
const REVIVE_TIME = 2.5;
const PERK_TIMEOUT = 20;

let nextId = 1;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const R = Math.round;

function weighted(items, weights) {
  let sum = 0; for (const w of weights) sum += w;
  let r = Math.random() * sum;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

class Room {
  constructor(code, { autoTick = true } = {}) {
    this.code = code;
    this.players = new Map();
    this.tickN = 0;
    this.reset();
    if (autoTick) this.iv = setInterval(() => { try { this.tick(); } catch (e) { console.error(e); } }, 1000 / TICK_HZ);
  }
  destroy() { clearInterval(this.iv); }

  reset() {
    this.enemies = []; this.bullets = []; this.ebullets = []; this.pickups = [];
    this.t = 0; this.spawnAcc = 0; this.nextBoss = 75; this.nextSwarm = 40;
    this.freezeT = 0; this.over = false; this.ev = []; this.hitEv = 0; this.round = (this.round || 0) + 1;
    let i = 0; for (const p of this.players.values()) this.spawnPlayer(p, i++);
  }

  spawnPlayer(p, i, near) {
    const a = i * 1.7, d = i ? 45 : 0;
    const cx = near ? near.x : MAP / 2, cy = near ? near.y : MAP / 2;
    Object.assign(p, {
      x: clamp(cx + Math.cos(a) * d, 40, MAP - 40), y: clamp(cy + Math.sin(a) * d, 40, MAP - 40),
      aim: 0, hp: 100, maxHp: 100, downed: false, weapon: 0, ammo: S.WEAPONS[0].clip, reloadT: 0, fireCd: 0,
      xp: 0, level: 1, pending: 0, choices: null, perks: {}, kills: 0, speedT: 0, shieldT: 2, rev: 0,
      firing: false, wantReload: false, lastIn: Date.now(), budget: 0, epoch: (p.epoch || 0) + 1,
    });
  }

  addPlayer(ws, name) {
    const used = new Set([...this.players.values()].map((p) => p.color));
    const id = nextId++;
    const p = { id, ws, name, color: COLORS.find((c) => !used.has(c)) || COLORS[id % COLORS.length] };
    const others = [...this.players.values()];
    const anchor = others.find((o) => !o.downed);
    this.spawnPlayer(p, others.length, anchor);
    if (others.length && !this.over && this.t > 20) {
      // catch-up so late joiners aren't useless
      const avg = others.reduce((s, o) => s + o.level, 0) / others.length;
      p.level = Math.max(1, Math.floor(avg * 0.75));
      p.pending = p.level - 1;
      if (p.pending) p.choices = this.rollPerks(p);
    }
    this.players.set(id, p);
    this.sendTo(p, { t: 'welcome', id, room: this.code, map: MAP });
    this.broadcastRoster();
    return p;
  }

  summary() {
    return { code: this.code, n: this.players.size, names: [...this.players.values()].map((p) => p.name), t: Math.floor(this.t), over: this.over };
  }

  removePlayer(p) { this.players.delete(p.id); this.broadcastRoster(); }

  broadcastRoster() {
    const list = [...this.players.values()].map((p) => ({ id: p.id, name: p.name, color: p.color }));
    for (const p of this.players.values()) this.sendTo(p, { t: 'roster', list });
  }

  sendTo(p, m) { if (p.ws && p.ws.readyState === 1) p.ws.send(JSON.stringify(m)); }

  stats(p) {
    const k = p.perks;
    return {
      rateMul: 1 + 0.15 * (k.fastshot || 0),
      dmgMul: 1 + 0.2 * (k.bloody || 0),
      reloadMul: Math.pow(0.7, k.fastload || 0),
      clipMul: 1 + 0.4 * (k.ammo || 0),
      spreadMul: k.sharp ? 0.5 : 1,
      bulletSpd: k.sharp ? 1.25 : 1,
      pierce: k.uranium || 0,
      speedMul: (1 + 0.12 * (k.runner || 0)) * (p.speedT > 0 ? 1.45 : 1),
      xpMul: 1 + 0.3 * (k.learner || 0),
      regen: 2 * (k.regen || 0),
      vamp: 2 * (k.vampire || 0),
      radio: k.radio || 0,
      magnet: k.magnet || 0,
    };
  }

  // ---------------- input ----------------
  onMessage(p, raw) {
    let m; try { m = JSON.parse(raw); } catch { return; }
    if (!m || typeof m !== 'object') return;
    if (m.t === 'i') {
      if (Number.isFinite(m.a)) p.aim = m.a;
      p.firing = !!m.f;
      if (m.r) p.wantReload = true;
      const now = Date.now();
      const el = Math.min(0.5, (now - p.lastIn) / 1000);
      p.lastIn = now;
      const spd = BASE_SPEED * this.stats(p).speedMul;
      p.budget = Math.min(spd * 0.6, p.budget + spd * el * 1.3 + 2);
      if (!p.downed && !this.over && !this.paused && !this.perkPause && m.ep === p.epoch && Number.isFinite(m.x) && Number.isFinite(m.y)) {
        let dx = m.x - p.x, dy = m.y - p.y;
        const d = Math.hypot(dx, dy);
        if (d > p.budget) {
          if (d > p.budget + 120) p.epoch++; // badly out of sync -> force client to snap
          const s = p.budget / d; dx *= s; dy *= s;
        }
        p.budget -= Math.min(d, p.budget);
        p.x = clamp(p.x + dx, PLAYER_R, MAP - PLAYER_R);
        p.y = clamp(p.y + dy, PLAYER_R, MAP - PLAYER_R);
      }
    } else if (m.t === 'perk') {
      this.choosePerk(p, m.i | 0);
    } else if (m.t === 'restart') {
      if (this.over) this.reset();
    }
  }

  // ---------------- simulation ----------------
  tick() {
    this.tickN++;
    this.updatePerkPause();
    if (!this.over && this.players.size && !this.paused && !this.perkPause) this.step();
    if (this.tickN % (this.sendEvery || SEND_EVERY) === 0) this.send();
  }

  step() {
    const dt = DT;
    const all = [...this.players.values()];
    const alive = all.filter((p) => !p.downed);
    if (!alive.length) { this.over = true; this.ev.push(['o']); return; }
    this.t += dt;
    if (this.freezeT > 0) this.freezeT -= dt;
    for (const p of all) this.updatePlayer(p, dt);
    this.spawn(dt, alive);
    this.updateEnemies(dt, alive);
    this.updateBullets(dt);
    this.updateEBullets(dt, alive);
    this.updatePickups(dt, alive);
    this.updateRevives(dt, alive);
    this.enemies = this.enemies.filter((e) => !e.dead);
  }

  updatePlayer(p, dt) {
    const st = this.stats(p), w = S.WEAPONS[p.weapon];
    if (p.speedT > 0) p.speedT -= dt;
    if (p.shieldT > 0) p.shieldT -= dt;
    if (p.downed) { p.firing = false; return; }
    if (st.regen && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + st.regen * dt);
    const clip = R(w.clip * st.clipMul);
    p.fireCd -= dt;
    if (p.reloadT > 0) {
      p.reloadT -= dt;
      if (p.reloadT <= 0) { p.reloadT = 0; p.ammo = clip; }
    } else if (p.wantReload && p.ammo < clip) {
      p.reloadT = w.reload * st.reloadMul;
    }
    p.wantReload = false;
    if (p.firing && p.reloadT <= 0) {
      let n = 0;
      while (p.fireCd <= 0 && p.ammo > 0 && n < 4) {
        this.fire(p, w, st); p.ammo--; p.fireCd += 1 / (w.rate * st.rateMul); n++;
      }
      if (p.ammo <= 0) p.reloadT = w.reload * st.reloadMul;
    }
    if (p.fireCd < 0) p.fireCd = 0;
    if (st.radio) {
      const rr = 80;
      for (const e of this.enemies) {
        if (e.dead) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        if (dx * dx + dy * dy < (rr + e.r) ** 2) this.damage(e, 30 * st.radio * dt, p.id, Math.atan2(dy, dx), true);
      }
    }
  }

  fire(p, w, st) {
    const a0 = p.aim, mx = p.x + Math.cos(a0) * 22, my = p.y + Math.sin(a0) * 22;
    for (let i = 0; i < w.pellets; i++) {
      if (this.bullets.length >= MAX_BULLETS) break;
      const a = a0 + (Math.random() - 0.5) * 2 * w.spread * st.spreadMul;
      const multi = w.pellets > 1;
      const sp = w.speed * st.bulletSpd * (multi ? rnd(0.85, 1.1) : 1);
      this.bullets.push({
        x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: w.dmg * st.dmgMul,
        life: w.life * (multi ? rnd(0.8, 1.15) : 1), pierce: w.pierce + st.pierce, kind: w.kind,
        owner: p.id, hit: null, splash: w.splash || 0, splashDmg: (w.splashDmg || 0) * st.dmgMul,
      });
    }
    this.ev.push(['f', p.id, p.weapon]);
  }

  pickType() {
    const t = this.t;
    return weighted([0, 1, 2, 3], [
      5,
      t > 20 ? 2 + t / 60 : 0,
      t > 45 ? 1.5 + t / 90 : 0,
      t > 90 ? 0.8 + t / 160 : 0,
    ]);
  }

  spawn(dt, alive) {
    const n = this.players.size, t = this.t;
    const rate = (0.8 + t * 0.018) * (0.55 + 0.45 * n);
    this.spawnAcc += rate * dt;
    while (this.spawnAcc >= 1) {
      this.spawnAcc--;
      if (this.enemies.length >= MAX_ENEMIES) { this.spawnAcc = 0; break; }
      this.spawnEnemy(this.pickType(), alive);
    }
    if (t >= this.nextSwarm) {
      this.nextSwarm += rnd(30, 45);
      const at = this.spawnPoint(alive);
      const cnt = R((8 + t / 20) * (0.6 + 0.4 * n));
      for (let i = 0; i < cnt && this.enemies.length < MAX_ENEMIES; i++) this.spawnEnemy(1, alive, at);
    }
    if (t >= this.nextBoss) {
      this.nextBoss += Math.max(45, 90 - t * 0.05);
      const cnt = 1 + Math.floor(t / 300) + Math.floor((n - 1) / 3);
      for (let i = 0; i < cnt; i++) this.spawnEnemy(4, alive);
      this.ev.push(['boss']);
    }
  }

  spawnPoint(alive) {
    let x = MAP / 2, y = MAP / 2;
    for (let tries = 0; tries < 10; tries++) {
      const p = alive[(Math.random() * alive.length) | 0];
      const a = rnd(0, Math.PI * 2), d = rnd(650, 850);
      x = clamp(p.x + Math.cos(a) * d, 30, MAP - 30);
      y = clamp(p.y + Math.sin(a) * d, 30, MAP - 30);
      if (alive.every((q) => (q.x - x) ** 2 + (q.y - y) ** 2 > 480 * 480)) break;
    }
    return { x, y };
  }

  spawnEnemy(ti, alive, at) {
    const T = S.ENEMIES[ti];
    const pt = at ? { x: clamp(at.x + rnd(-50, 50), 20, MAP - 20), y: clamp(at.y + rnd(-50, 50), 20, MAP - 20) } : this.spawnPoint(alive);
    const hpMul = (1 + this.t / 240) * (ti === 4 ? 0.6 + 0.4 * this.players.size : 1);
    this.enemies.push({
      id: nextId++, ti, x: pt.x, y: pt.y, a: 0, hp: T.hp * hpMul, mhp: T.hp * hpMul,
      spd: T.spd * rnd(0.9, 1.12) * (1 + Math.min(0.35, this.t / 1200)), r: T.r,
      cd: rnd(1, T.cd || 1), kx: 0, ky: 0, dead: false, wob: rnd(0, 6),
    });
  }

  updateEnemies(dt, alive) {
    const frozen = this.freezeT > 0;
    const CELL = 48, grid = new Map();
    for (const e of this.enemies) {
      const k = ((e.x / CELL) | 0) * 1024 + ((e.y / CELL) | 0);
      let c = grid.get(k); if (!c) grid.set(k, (c = [])); c.push(e);
    }
    const dmgScale = 1 + this.t / 600;
    const kd = Math.exp(-8 * dt);
    for (const e of this.enemies) {
      if (e.dead) continue;
      const T = S.ENEMIES[e.ti];
      let tgt = null, bd = Infinity;
      for (const p of alive) { const d = (p.x - e.x) ** 2 + (p.y - e.y) ** 2; if (d < bd) { bd = d; tgt = p; } }
      if (!tgt) continue;
      const dx = tgt.x - e.x, dy = tgt.y - e.y, d = Math.sqrt(bd) || 1;
      e.x += e.kx * dt; e.y += e.ky * dt; e.kx *= kd; e.ky *= kd;
      if (!frozen) {
        let mx = dx / d, my = dy / d;
        if (T.range) {
          if (d < T.range * 0.55) { mx = -mx; my = -my; }
          else if (d < T.range) { const s = Math.sin(e.wob + this.t * 0.7) > 0 ? 1 : -1; mx = -dy / d * s * 0.7; my = dx / d * s * 0.7; }
          e.cd -= dt;
          if (e.cd <= 0 && d < T.range + 60) {
            e.cd = T.cd * rnd(0.8, 1.25);
            const a = Math.atan2(dy, dx);
            this.ebullets.push({ x: e.x + Math.cos(a) * 18, y: e.y + Math.sin(a) * 18, vx: Math.cos(a) * T.pspd, vy: Math.sin(a) * T.pspd, life: 2.5, dmg: T.pdmg * dmgScale });
          }
        } else if (e.ti === 0) {
          const w = Math.sin(this.t * 2 + e.wob) * 0.35; // zombies shamble
          const c = Math.cos(w), s = Math.sin(w); const nx = mx * c - my * s; my = mx * s + my * c; mx = nx;
        }
        e.x += mx * e.spd * dt; e.y += my * e.spd * dt;
        e.a = Math.atan2(dy, dx);
      }
      // separation
      const cx = (e.x / CELL) | 0, cy = (e.y / CELL) | 0;
      for (let ix = cx - 1; ix <= cx + 1; ix++) for (let iy = cy - 1; iy <= cy + 1; iy++) {
        const c = grid.get(ix * 1024 + iy); if (!c) continue;
        for (const o of c) {
          if (o === e || o.dead) continue;
          const ox = e.x - o.x, oy = e.y - o.y, rr = e.r + o.r, dd = ox * ox + oy * oy;
          if (dd < rr * rr && dd > 0.01) {
            const dl = Math.sqrt(dd), push = (rr - dl) * 0.5 * (o.r / rr) * 2;
            e.x += (ox / dl) * push * 0.5; e.y += (oy / dl) * push * 0.5;
          }
        }
      }
      e.x = clamp(e.x, 10, MAP - 10); e.y = clamp(e.y, 10, MAP - 10);
      if (frozen) continue;
      for (const p of alive) {
        if (p.downed) continue;
        const rr = e.r + PLAYER_R;
        if ((p.x - e.x) ** 2 + (p.y - e.y) ** 2 < rr * rr && p.shieldT <= 0) {
          p.hp -= T.dmg * dmgScale * dt;
          if (p.hp <= 0) this.down(p);
        }
      }
    }
  }

  updateBullets(dt) {
    const out = [];
    for (const b of this.bullets) {
      const nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
      b.life -= dt;
      const sx = nx - b.x, sy = ny - b.y, len2 = sx * sx + sy * sy || 1;
      const minX = Math.min(b.x, nx), maxX = Math.max(b.x, nx), minY = Math.min(b.y, ny), maxY = Math.max(b.y, ny);
      for (const e of this.enemies) {
        if (e.dead) continue;
        const rr = e.r + 4;
        if (e.x < minX - rr || e.x > maxX + rr || e.y < minY - rr || e.y > maxY + rr) continue;
        const tt = clamp(((e.x - b.x) * sx + (e.y - b.y) * sy) / len2, 0, 1);
        const px = b.x + sx * tt, py = b.y + sy * tt;
        if ((e.x - px) ** 2 + (e.y - py) ** 2 > rr * rr) continue;
        if (b.hit && b.hit.has(e.id)) continue;
        if (b.splash) { this.explode(px, py, b.splash, b.splashDmg, b.owner); b.life = 0; b.boom = true; break; }
        const ang = Math.atan2(b.vy, b.vx);
        this.damage(e, b.dmg, b.owner, ang);
        if (this.hitEv < 50) { this.hitEv++; this.ev.push(['h', R(px), R(py), +ang.toFixed(2)]); }
        if (b.pierce > 0) { b.pierce--; (b.hit || (b.hit = new Set())).add(e.id); }
        else { b.life = 0; break; }
      }
      b.x = nx; b.y = ny;
      if (b.x < 0 || b.y < 0 || b.x > MAP || b.y > MAP) b.life = 0;
      if (b.life > 0) out.push(b);
      else if (b.splash && !b.boom) this.explode(b.x, b.y, b.splash, b.splashDmg, b.owner);
    }
    this.bullets = out;
  }

  updateEBullets(dt, alive) {
    this.ebullets = this.ebullets.filter((b) => {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (this.freezeT > 0) { b.x -= b.vx * dt; b.y -= b.vy * dt; }
      for (const p of alive) {
        if (p.downed) continue;
        if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < (PLAYER_R + 6) ** 2) {
          if (p.shieldT <= 0) { p.hp -= b.dmg; if (p.hp <= 0) this.down(p); }
          return false;
        }
      }
      return b.life > 0;
    });
  }

  explode(x, y, r, dmg, owner) {
    this.ev.push(['x', R(x), R(y), r]);
    for (const e of this.enemies) {
      if (e.dead) continue;
      const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
      if (d < r + e.r) this.damage(e, dmg * (1 - (d / (r + e.r)) * 0.5), owner, Math.atan2(dy, dx));
    }
  }

  damage(e, dmg, owner, ang, noKnock) {
    if (e.dead) return;
    e.hp -= dmg;
    if (!noKnock) {
      const kb = Math.min(260, dmg * 6) * (14 / e.r) * (e.ti === 4 ? 0.15 : 1);
      e.kx += Math.cos(ang) * kb; e.ky += Math.sin(ang) * kb;
    }
    if (e.hp <= 0) this.kill(e, this.players.get(owner), ang);
  }

  kill(e, p, ang) {
    e.dead = true;
    const T = S.ENEMIES[e.ti];
    this.ev.push(['d', R(e.x), R(e.y), e.ti, +ang.toFixed(2)]);
    if (p) {
      p.kills++;
      this.giveXp(p, T.xp);
      const st = this.stats(p);
      if (st.vamp && !p.downed) p.hp = Math.min(p.maxHp, p.hp + st.vamp);
    }
    for (const o of this.players.values()) if (o !== p) this.giveXp(o, T.xp * 0.3);
    const mag = [...this.players.values()].some((q) => q.perks.magnet) ? 1.5 : 1;
    if (e.ti === 4) {
      this.dropPickup(e.x - 15, e.y, BI.weapon);
      this.dropPickup(e.x + 15, e.y, this.randomBonus());
    } else {
      const r = Math.random();
      if (r < 0.02 * mag) this.dropPickup(e.x, e.y, BI.weapon);
      else if (r < 0.065 * mag) this.dropPickup(e.x, e.y, this.randomBonus());
    }
  }

  randomBonus() {
    const opts = S.BONUSES.map((_, i) => i).filter((i) => i !== BI.weapon);
    return weighted(opts, opts.map((i) => S.BONUSES[i].w));
  }

  dropPickup(x, y, bi) {
    if (this.pickups.length >= MAX_PICKUPS) return;
    let w = -1;
    if (bi === BI.weapon) {
      const maxTier = 1 + this.t / 90;
      const opts = S.WEAPONS.map((_, i) => i).filter((i) => i > 0 && S.WEAPONS[i].tier <= maxTier);
      w = opts[(Math.random() * opts.length) | 0];
    }
    this.pickups.push({ id: nextId++, bi, w, x: clamp(x, 20, MAP - 20), y: clamp(y, 20, MAP - 20), t: 14 });
  }

  updatePickups(dt, alive) {
    for (const k of this.pickups) {
      k.t -= dt;
      for (const p of alive) {
        const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy);
        if (p.perks.magnet && d < 230 && d > 1) { k.x += (dx / d) * 320 * dt; k.y += (dy / d) * 320 * dt; }
        if (d < 28) { this.collect(p, k); k.t = 0; break; }
      }
    }
    this.pickups = this.pickups.filter((k) => k.t > 0);
  }

  collect(p, k) {
    const B = S.BONUSES[k.bi], st = this.stats(p);
    this.ev.push(['p', p.id, k.bi, k.w, R(k.x), R(k.y)]);
    switch (B.key) {
      case 'med': p.hp = Math.min(p.maxHp, p.hp + 40); break;
      case 'nuke': {
        this.ev.push(['n', R(k.x), R(k.y)]);
        for (const e of this.enemies) {
          const dx = e.x - k.x, dy = e.y - k.y;
          if (dx * dx + dy * dy < 540 * 540) this.damage(e, 1000 * (1 + this.t / 240), p.id, Math.atan2(dy, dx));
        }
        this.ebullets = this.ebullets.filter((b) => (b.x - k.x) ** 2 + (b.y - k.y) ** 2 > 540 * 540);
        break;
      }
      case 'fire':
        for (let i = 0; i < 40; i++) {
          const a = (i / 40) * Math.PI * 2;
          this.bullets.push({ x: k.x, y: k.y, vx: Math.cos(a) * 650, vy: Math.sin(a) * 650, dmg: 45 * st.dmgMul, life: 1.1, pierce: 3, kind: 1, owner: p.id, hit: null, splash: 0, splashDmg: 0 });
        }
        break;
      case 'speed': p.speedT = 10; break;
      case 'freeze': this.freezeT = 7; break;
      case 'shield': p.shieldT = 9; break;
      case 'weapon': {
        const w = S.WEAPONS[k.w];
        p.weapon = k.w; p.ammo = R(w.clip * st.clipMul); p.reloadT = 0; p.fireCd = 0;
        break;
      }
    }
  }

  giveXp(p, amt) {
    p.xp += amt * this.stats(p).xpMul;
    let need = S.xpNeed(p.level);
    while (p.xp >= need) {
      p.xp -= need; p.level++; p.pending++;
      this.ev.push(['l', p.id, p.level]);
      need = S.xpNeed(p.level);
    }
    if (p.pending > 0 && !p.choices) p.choices = this.rollPerks(p);
  }

  // Any player choosing a perk pauses the whole room. After PERK_TIMEOUT s a random perk is taken
  // so one AFK player can't freeze everyone forever.
  updatePerkPause() {
    let any = false;
    for (const p of this.players.values()) {
      if (!p.choices || this.over) { p.choiceT = 0; continue; }
      any = true;
      if (!p.choiceT) p.choiceT = PERK_TIMEOUT;
      if (!this.noPerkTimeout) p.choiceT -= DT;
      if (p.choiceT <= 0) { p.choiceT = 0; this.choosePerk(p, (Math.random() * p.choices.length) | 0); if (p.choices) any = true; }
    }
    this.perkPause = any;
  }

  rollPerks(p) {
    const avail = S.PERKS.filter((k) => (p.perks[k.key] || 0) < k.max).map((k) => k.key);
    for (let i = avail.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [avail[i], avail[j]] = [avail[j], avail[i]]; }
    if (!avail.length) { p.pending = 0; return null; }
    return avail.slice(0, 3);
  }

  choosePerk(p, i) {
    if (!p.choices || !p.choices[i]) return;
    const key = p.choices[i];
    p.perks[key] = (p.perks[key] || 0) + 1;
    if (key === 'thick') { p.maxHp += 30; if (!p.downed) p.hp += 30; }
    if (key === 'ammo' && p.reloadT <= 0) p.ammo = R(S.WEAPONS[p.weapon].clip * this.stats(p).clipMul);
    p.pending--;
    p.choices = p.pending > 0 ? this.rollPerks(p) : null;
    p.choiceT = p.choices ? PERK_TIMEOUT : 0;
    this.ev.push(['pk', p.id, key]);
  }

  down(p) {
    if (p.downed) return;
    p.downed = true; p.hp = 0; p.rev = 0; p.firing = false; p.reloadT = 0;
    this.ev.push(['dn', p.id]);
  }

  updateRevives(dt, alive) {
    for (const p of this.players.values()) {
      if (!p.downed) continue;
      const helped = alive.some((q) => !q.downed && q !== p && (q.x - p.x) ** 2 + (q.y - p.y) ** 2 < 55 * 55);
      p.rev = helped ? p.rev + dt : Math.max(0, p.rev - dt * 0.5);
      if (p.rev >= REVIVE_TIME) {
        p.downed = false; p.hp = p.maxHp * 0.5; p.shieldT = 2.5; p.rev = 0;
        this.ev.push(['rv', p.id]);
      }
    }
  }

  // ---------------- networking ----------------
  send() {
    const P = [], E = [], B = [], EB = [], K = [];
    for (const p of this.players.values())
      P.push([p.id, R(p.x), R(p.y), R(p.aim * 100), R((Math.max(0, p.hp) / p.maxHp) * 100), p.downed ? 1 : 0, p.weapon, p.level, p.shieldT > 0 ? 1 : 0, R((p.rev / REVIVE_TIME) * 100), p.kills]);
    for (const e of this.enemies) if (!e.dead) E.push([e.id, e.ti, R(e.x), R(e.y), R(e.a * 100), R((Math.max(0, e.hp) / e.mhp) * 100)]);
    for (const b of this.bullets) B.push([R(b.x), R(b.y), R(b.vx), R(b.vy), b.kind]);
    for (const b of this.ebullets) EB.push([R(b.x), R(b.y), R(b.vx), R(b.vy)]);
    for (const k of this.pickups) K.push([k.id, k.bi, R(k.x), R(k.y), k.w, +k.t.toFixed(1)]);
    const PZ = [];
    for (const p of this.players.values()) if (p.choices) PZ.push([p.id, this.noPerkTimeout ? 0 : Math.ceil(p.choiceT || PERK_TIMEOUT)]);
    const shared = JSON.stringify({ pz: PZ, tm: +this.t.toFixed(3), rd: this.round, fz: this.freezeT > 0 ? 1 : 0, ov: this.over ? 1 : 0, p: P, e: E, b: B, eb: EB, k: K, ev: this.ev });

      if (!p.ws || p.ws.readyState !== 1) continue;
      if (p.ws.bufferedAmount > 512 * 1024) continue; // slow client: skip a frame

        x: R(p.x), y: R(p.y), ep: p.epoch, hp: Math.ceil(Math.max(0, p.hp)), mhp: p.maxHp, w: p.weapon, am: p.ammo,
        cl: R(w.clip * st.clipMul), rl: p.reloadT > 0 ? +(1 - p.reloadT / (w.reload * st.reloadMul)).toFixed(2) : 0,
        lv: p.level, xp: Math.floor(p.xp), nx: S.xpNeed(p.level), ch: p.choices, pd: p.pending, pr: p.perks,
        sp: +st.speedMul.toFixed(3), fr: +(w.rate * st.rateMul).toFixed(2), dn: p.downed ? 1 : 0,

    }
  }
}

function drawEnemy(c, ti, x, y, a, t, o = {}) {

// Pre-rendered enemy animation frames. Drawing vector shapes for hundreds of enemies every frame
// is what made crowds laggy; stamping cached bitmaps is many times cheaper.
const ANIM_W = [6, 20, 9, 5, 3];          // animation angular speed per enemy type (matches drawEnemy)
const SPR_HALF = [32, 28, 42, 28, 62];    // half-size of each sprite box in world units
const SPR_FRAMES = 12;
let sprites = null, spriteScale = 0;
function buildSprites(scale) {
  spriteScale = scale;
  sprites = SPR_HALF.map((half, ti) => [{}, { flash: true }, { frozen: true }].map((variant) => {
    const out = [];
    for (let k = 0; k < SPR_FRAMES; k++) {
      const c = document.createElement('canvas');
      c.width = c.height = Math.ceil(half * 2 * scale);
      const x = c.getContext('2d');
      x.setTransform(scale, 0, 0, scale, half * scale, half * scale);
      drawEnemy(x, ti, 0, 0, 0, 0, Object.assign({ ph: (k / SPR_FRAMES) * TAU / ANIM_W[ti] }, variant));
      out.push(c);
    }

  }));
}
// draws one enemy sprite; Z = world->device scale, (ox, oy) = camera top-left in world units
function stampEnemy(ti, x, y, a, t, variant, Z, ox, oy) {
  const ph = t + (x * 0.013 + y * 0.007);
  let f = ((ph * ANIM_W[ti]) / TAU) % 1; if (f < 0) f += 1;
  const img = sprites[ti][variant][(f * SPR_FRAMES) | 0];

const GUNLEN = [16, 17, 20, 24, 22, 26, 24, 20];
function drawPlayer(c, x, y, a, color, o) {
  c.save(); c.translate(x, y);

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, sndBudget = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch { AC = null; }
}
function noise(dur, freq, vol, type = 'bandpass', q = 1) {
  if (!AC || sndBudget <= 0) return; sndBudget--;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
  s.buffer = noiseBuf; s.playbackRate.value = rnd(0.9, 1.1);
  f.type = type; f.frequency.value = freq; f.Q.value = q;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(gn); gn.connect(master); s.start(t, Math.random() * 0.5, dur + 0.05);
}
function tone(f0, f1, dur, vol, type = 'square') {
  if (!AC || sndBudget <= 0) return; sndBudget--;
  const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  shot(w, v = 1) {
    switch (w) {
      case 0: noise(0.09, 1700, 0.5 * v); tone(400, 120, 0.05, 0.08 * v); break;
      case 1: noise(0.06, 2300, 0.35 * v); break;
      case 2: noise(0.22, 900, 0.8 * v, 'lowpass'); tone(160, 50, 0.12, 0.2 * v, 'sine'); break;
      case 3: noise(0.08, 1400, 0.45 * v); tone(300, 90, 0.05, 0.08 * v); break;
      case 4: tone(1100, 220, 0.13, 0.12 * v, 'square'); break;
      case 5: tone(2400, 90, 0.3, 0.16 * v, 'sawtooth'); noise(0.15, 3000, 0.25 * v); break;
      case 6: noise(0.3, 500, 0.5 * v, 'lowpass'); break;
      case 7: noise(0.08, 500, 0.18 * v, 'lowpass'); break;
    }
  },
  splat(v = 1) { noise(0.12, 380, 0.35 * v, 'lowpass'); },
  boom(v = 1) { noise(0.7, 260, 0.9 * v, 'lowpass'); tone(90, 30, 0.5, 0.35 * v, 'sine'); },
  pickup() { tone(600, 1300, 0.14, 0.12, 'triangle'); },
  level() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, 0.12, 0.1, 'triangle'), i * 70)); },
  hurt() { tone(220, 80, 0.15, 0.15, 'sawtooth'); },
  reload() { tone(900, 900, 0.03, 0.06, 'square'); setTimeout(() => tone(1300, 1300, 0.03, 0.06, 'square'), 120); },
  down() { tone(400, 60, 0.6, 0.18, 'sawtooth'); },
  boss() { tone(70, 50, 1.2, 0.3, 'sawtooth'); noise(1.0, 150, 0.3, 'lowpass'); },
};

// ---------- particles & floating text ----------
const parts = [], texts = [];
function addPart(p) { if (parts.length < 900) parts.push(p); }
function bloodSpray(x, y, ang, ti, n, spd = 160) {
  const col = BLOOD[ti] || BLOOD[0];
  for (let i = 0; i < n; i++) {
    const a = ang + rnd(-0.6, 0.6), s = rnd(0.3, 1) * spd;
    addPart({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.2, 0.45), max: 0.45, size: rnd(1.5, 3.5), color: col, kind: 'blood', drag: 4 });
  }
}
function shell(x, y, a) {
  const sa = a + Math.PI / 2 + rnd(-0.3, 0.3), s = rnd(60, 120);
  addPart({ x, y, vx: Math.cos(sa) * s, vy: Math.sin(sa) * s, life: 0.35, max: 0.35, size: 2, color: '#c9a23a', kind: 'shell', drag: 6, rot: rnd(0, 3) });
}
function explosionFx(x, y, r) {
  for (let i = 0; i < 30; i++) { const a = rnd(0, TAU), s = rnd(40, r * 3); addPart({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.25, 0.6), max: 0.6, size: rnd(6, 16), color: pick(['#ffb347', '#ff7a1f', '#ffd27a']), kind: 'fire', drag: 3 }); }
  for (let i = 0; i < 14; i++) { const a = rnd(0, TAU), s = rnd(10, 60); addPart({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.8, 1.6), max: 1.6, size: rnd(14, 26), color: '#2a2622', kind: 'smoke', drag: 1 }); }
  addPart({ x, y, vx: 0, vy: 0, life: 0.18, max: 0.18, size: r, color: '#fff3c4', kind: 'flash', drag: 0 });
}
function floatText(x, y, s, color = '#fff', big = false) { texts.push({ x, y, s, color, life: big ? 2 : 1.3, max: big ? 2 : 1.3, big }); }

// ---------- network state ----------
let ws = null, myId = 0, roomCode = '', roster = new Map();
let snaps = [], me = null, clockOff = null, lastRound = 0, overShown = false;
const local = { x: MAP / 2, y: MAP / 2, ep: -1, aim: 0 };
const keys = {}, mouse = { x: 0, y: 0, down: false };
let reloadReq = false, shake = 0, hurtFlash = 0, nukeFlash = 0, prevHp = null, lastShotFx = new Map();
let predAmmo = 0, lastSrvAmmo = -1, lastSrvW = -1, localCd = 0, lastReloadUi = 0;
const enemyFlash = new Map();

function connect(name, room) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`);
  ws.onmessage = (ev) => handleMsg(ev.data);
  ws.onclose = () => { if (myId) showJoin('Disconnected from server.'); myId = 0; };
  ws.onerror = () => showJoin('Could not connect.');
}

// Solo: run the same simulation in this page and talk to it through a fake socket.
function connectSolo(name) {
  const room = new window.SIM.Room('SOLO');
  room.sendEvery = 1; room.noPerkTimeout = true;
  soloRoom = room; userPaused = false;
  const sock = { readyState: 1, bufferedAmount: 0, send: (data) => handleMsg(data) };
  const p = room.addPlayer(sock, name);
  ws = { readyState: 1, send: (data) => room.onMessage(p, data), close() { room.destroy(); soloRoom = null; } };
}
function soloPaused() { return !!soloRoom && soloRoom.paused; }
function syncPause() { if (soloRoom) soloRoom.paused = userPaused; }
// true while the simulation is frozen: someone in the room is picking a perk, or solo pause
function isPaused() { const s = latestSnap(); return soloPaused() || !!(s && s.pz && s.pz.length && !s.ov); }
document.addEventListener('visibilitychange', () => { if (document.hidden && soloRoom && !soloRoom.over) { userPaused = true; syncPause(); } });

function handleMsg(data) {
  {
    const m = JSON.parse(data);
    if (m.t === 's') onSnap(m);
    else if (m.t === 'welcome') { myId = m.id; roomCode = m.room; document.getElementById('roomCode').textContent = roomCode; }
    else if (m.t === 'roster') { roster = new Map(m.list.map((p) => [p.id, p])); }
    else if (m.t === 'full') { showJoin('That room is full (8 players).'); }
  }
}

function onSnap(m) {
  const now = performance.now() / 1000;
  if (m.rd !== lastRound) { // new round: wipe state
    if (lastRound) { genGround(); parts.length = 0; texts.length = 0; }
    lastRound = m.rd; snaps = []; clockOff = null; overShown = false;
    document.getElementById('over').classList.add('hidden');
  }
  const target = m.tm - now;
  if (clockOff === null || Math.abs(target - clockOff) > 1) clockOff = target;
  else clockOff += (target - clockOff) * 0.06;
  m.rt = now; m.done = false;
  m.Pm = new Map(m.p.map((a) => [a[0], a]));
  m.Em = new Map(m.e.map((a) => [a[0], a]));
  snaps.push(m); if (snaps.length > 40) snaps.shift();

  const prev = me; me = m.me;
  if (me.ep !== local.ep || me.dn) { local.x = me.x; local.y = me.y; local.ep = me.ep; }
  if (prevHp !== null && me.hp < prevHp - 0.5 && !me.dn) { hurtFlash = Math.min(0.45, hurtFlash + 0.18); SFX.hurt(); }
  prevHp = me.hp;
  if (me.w !== lastSrvW || me.am > lastSrvAmmo) predAmmo = me.am; else predAmmo = Math.min(predAmmo, me.am);
  lastSrvW = me.w; lastSrvAmmo = me.am;
  if (prev && !prev.rl && me.rl) SFX.reload();
  updatePerkUI();
  const mine = m.pz && m.pz.find((z) => z[0] === myId), pt = document.getElementById('perkT');
  if (pt) pt.textContent = mine && mine[1] ? ` · auto-pick in ${mine[1]}s` : '';
  if (m.ov && !overShown) showOver(m);
}

function processEvents(ev) {
  const mx = local.x, my = local.y;
  const vol = (x, y) => clamp(1 - Math.hypot(x - mx, y - my) / 1100, 0.05, 1);
  for (const e of ev) {
    switch (e[0]) {
      case 'd': {
        const [, x, y, ti, ang] = e;
        bloodSplat(x, y, ti, ang, ti === 4 ? 2.2 : 1);
        g.globalAlpha = 0.7; drawEnemy(g, ti, x + Math.cos(ang) * 6, y + Math.sin(ang) * 6, ang + rnd(-0.6, 0.6), 0, { dead: true }); g.globalAlpha = 1;
        bloodSpray(x, y, ang, ti, ti === 4 ? 40 : 10, 220);
        SFX.splat(vol(x, y));
        break;
      }
      case 'h': bloodSpray(e[1], e[2], e[3], 0, 3, 140); break;
      case 'x': explosionFx(e[1], e[2], e[3]); scorch(e[1], e[2], e[3] * 0.7); shake = Math.max(shake, 10 * vol(e[1], e[2])); SFX.boom(vol(e[1], e[2])); break;
      case 'n': nukeFlash = 1; shake = 28; scorch(e[1], e[2], 300); SFX.boom(1); setTimeout(() => SFX.boom(0.7), 120); break;
      case 'f': {
        if (e[1] === myId) break;
        const s = latestSnap(); const p = s && s.Pm.get(e[1]);
        lastShotFx.set(e[1], performance.now());
        if (p) { SFX.shot(e[2], vol(p[1], p[2]) * 0.6); if (e[2] !== 7 && e[2] !== 4) shell(p[1], p[2], p[3] / 100); }
        break;
      }
      case 'p': {
        const [, pid, bi, w, x, y] = e;
        const B = S.BONUSES[bi];
        floatText(x, y - 20, B.key === 'weapon' ? S.WEAPONS[w].name : B.name, B.color);
        if (pid === myId) SFX.pickup();
        break;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!vignette) {
    vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,.6)');
  }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (frozen) { ctx.fillStyle = 'rgba(120,200,255,.10)'; ctx.fillRect(0, 0, W, H); }
  hurtFlash = Math.max(0, hurtFlash - dt * 1.5);
  if (hurtFlash > 0) { ctx.fillStyle = `rgba(160,0,0,${hurtFlash * 0.5})`; ctx.fillRect(0, 0, W, H); }
  nukeFlash = Math.max(0, nukeFlash - dt * 1.8);
  if (nukeFlash > 0) { ctx.fillStyle = `rgba(255,250,220,${nukeFlash * 0.85})`; ctx.fillRect(0, 0, W, H); }
  drawHUD(L, players, t);
}

function drawPickup(x, y, bi, w, t) {
  const B = S.BONUSES[bi];
  const bob = Math.sin(t * 4 + x) * 2;
  ctx.save(); ctx.translate(x, y + bob);
  ctx.globalAlpha = 0.25 + Math.sin(t * 5) * 0.08; ell(ctx, 0, 0, 20, 20, B.color); ctx.globalAlpha = 1;
  ell(ctx, 0, 0, 13, 13, '#16110c', B.color, 2);
  ctx.fillStyle = B.color; ctx.strokeStyle = B.color; ctx.lineWidth = 2;
  switch (B.key) {
    case 'med': ctx.fillRect(-2.5, -7, 5, 14); ctx.fillRect(-7, -2.5, 14, 5); break;
    case 'nuke': for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 9, i * TAU / 3 - 0.5, i * TAU / 3 + 0.5); ctx.fill(); } ell(ctx, 0, 0, 2.5, 2.5, '#16110c'); break;
    case 'fire': for (let i = 0; i < 8; i++) { const a = i * TAU / 8; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 3, Math.sin(a) * 3); ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9); ctx.stroke(); } break;
    case 'speed': ctx.beginPath(); ctx.moveTo(2, -9); ctx.lineTo(-5, 1); ctx.lineTo(0, 1); ctx.lineTo(-2, 9); ctx.lineTo(5, -1); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill(); break;
    case 'freeze': for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * -9, Math.sin(a) * -9); ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9); ctx.stroke(); } break;
    case 'shield': ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(7, -5); ctx.lineTo(6, 3); ctx.lineTo(0, 9); ctx.lineTo(-6, 3); ctx.lineTo(-7, -5); ctx.closePath(); ctx.stroke(); break;
    case 'weapon': ctx.fillStyle = '#ddd'; ctx.fillRect(-9, -2, 16, 4); ctx.fillRect(-6, 1, 4, 6); break;
  }
  ctx.restore();
  ctx.font = '10px "Share Tech Mono", ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = B.color;
  ctx.fillText(B.key === 'weapon' ? S.WEAPONS[w].name.toUpperCase() : B.name.toUpperCase(), x, y + 28);
}

function bar(x, y, w, h, f, col, bg = 'rgba(0,0,0,.55)') {
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function drawHUD(L, players, t) {
  const x0 = 18, y0 = 18;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  // HP
  bar(x0, y0, 240, 18, me.hp / me.mhp, me.hp / me.mhp > 0.35 ? '#c62828' : (Math.floor(t * 4) % 2 ? '#ff1744' : '#7f0000'));
  ctx.fillStyle = '#fff'; ctx.font = '13px "Share Tech Mono", ui-monospace, monospace'; ctx.fillText(`HP ${me.hp}/${me.mhp}`, x0 + 8, y0 + 14);
  // XP
  bar(x0, y0 + 24, 240, 8, me.xp / me.nx, '#cddc39');
  ctx.font = 'bold 15px Oswald, sans-serif'; ctx.fillStyle = '#e6ee9c'; ctx.fillText(`LEVEL ${me.lv}`, x0, y0 + 52);
  // weapon
  const w = S.WEAPONS[me.w];
  ctx.fillStyle = '#f3e9d6'; ctx.font = 'bold 18px Oswald, sans-serif'; ctx.fillText(w.name.toUpperCase(), x0, y0 + 78);
  if (me.rl) { bar(x0, y0 + 86, 240, 10, me.rl, '#90a4ae'); ctx.fillStyle = '#cfd8dc'; ctx.font = '11px "Share Tech Mono", ui-monospace, monospace'; ctx.fillText('RELOADING', x0 + 4, y0 + 95); }
  else {
    const n = Math.min(me.cl, 60), pw = Math.max(2, Math.min(8, 240 / n - 2));
    for (let i = 0; i < n; i++) { const filled = i < Math.round(me.am / me.cl * n); ctx.fillStyle = filled ? '#ffca28' : 'rgba(255,255,255,.12)'; ctx.fillRect(x0 + i * (pw + 2), y0 + 86, pw, 10); }
    ctx.fillStyle = '#b9a98e'; ctx.font = '12px "Share Tech Mono", ui-monospace, monospace'; ctx.fillText(`${me.am}/${me.cl}`, x0 + Math.min(240, n * (pw + 2)) + 6, y0 + 95);
  }
  let yy = y0 + 118;
  ctx.font = '12px "Share Tech Mono", ui-monospace, monospace';
  if (me.spd > 0) { ctx.fillStyle = '#29b6f6'; ctx.fillText(`SPEED ${me.spd.toFixed(0)}s`, x0, yy); yy += 16; }
  if (me.sh > 0) { ctx.fillStyle = '#66bb6a'; ctx.fillText(`SHIELD ${me.sh.toFixed(0)}s`, x0, yy); yy += 16; }
  const owned = Object.entries(me.pr || {});
  if (owned.length) {
    ctx.fillStyle = '#8d7c63';
    for (const [k, n] of owned) { const p = S.PERKS.find((x) => x.key === k); ctx.fillText(`${p.name}${n > 1 ? ' x' + n : ''}`, x0, yy); yy += 14; }
  }

  // timer + kills
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px Oswald, sans-serif'; ctx.fillStyle = '#f3e9d6'; ctx.fillText(fmtTime(L.tm), W / 2, 40);
  const totalKills = L.p.reduce((s, p) => s + p[10], 0);
  ctx.font = '13px "Share Tech Mono", ui-monospace, monospace'; ctx.fillStyle = '#b9a98e'; ctx.fillText(`${totalKills} kills · ${L.e.length} hostiles`, W / 2, 60);
  if (L.fz) { ctx.fillStyle = '#b3e5fc'; ctx.font = 'bold 16px Oswald, sans-serif'; ctx.fillText('FROZEN', W / 2, 82); }

  // team list
  ctx.textAlign = 'right';
  let ty = 26;
  for (const p of SOLO ? [] : L.p) {
    const r = roster.get(p[0]) || { name: '?', color: '#fff' };
    ctx.font = (p[0] === myId ? 'bold ' : '') + '13px "Share Tech Mono", ui-monospace, monospace';
    ctx.fillStyle = p[5] ? '#ff5252' : r.color;
    ctx.fillText(`${r.name}  L${p[7]}  ${p[10]} kills${p[5] ? '  DOWN' : ''}`, W - 18, ty);
    bar(W - 118, ty + 4, 100, 3, p[4] / 100, p[5] ? '#555' : '#66bb6a');
    ty += 24;
  }

  // minimap
  const mm = 140, mx0 = W - mm - 16, my0 = H - mm - 16, sc = mm / MAP;
  ctx.fillStyle = 'rgba(10,8,6,.7)'; ctx.fillRect(mx0, my0, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.strokeRect(mx0 + 0.5, my0 + 0.5, mm - 1, mm - 1);
  ctx.fillStyle = '#c62828';
  for (const e of L.e) ctx.fillRect(mx0 + e[2] * sc - (e[1] === 4 ? 2 : 0.75), my0 + e[3] * sc - (e[1] === 4 ? 2 : 0.75), e[1] === 4 ? 4 : 1.5, e[1] === 4 ? 4 : 1.5);
  for (const k of L.k) { ctx.fillStyle = S.BONUSES[k[1]].color; ctx.fillRect(mx0 + k[2] * sc - 1.5, my0 + k[3] * sc - 1.5, 3, 3); }
  for (const p of L.p) {
    const r = roster.get(p[0]) || { color: '#fff' };
    const px = p[0] === myId ? local.x : p[1], py = p[0] === myId ? local.y : p[2];
    ctx.fillStyle = p[5] ? '#ff5252' : r.color; ctx.beginPath(); ctx.arc(mx0 + px * sc, my0 + py * sc, p[0] === myId ? 3.5 : 2.5, 0, TAU); ctx.fill();
  }

  // edge arrows pointing to downed teammates that are off-screen
  for (const p of players) {
    if (!p.down || p.isMe) continue;
    const sx = W / 2 + (p.x - cam.x) * ZOOM, sy = H / 2 + (p.y - cam.y) * ZOOM;
    if (sx > 20 && sx < W - 20 && sy > 20 && sy < H - 20) continue;
    const an = Math.atan2(sy - H / 2, sx - W / 2);
    const ex = clamp(sx, 40, W - 40), ey = clamp(sy, 120, H - 60);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(an);
    ctx.fillStyle = Math.floor(t * 3) % 2 ? '#69f0ae' : '#ff5252';
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill(); ctx.restore();
  }

  if (!SOLO && L.pz && L.pz.length && !L.ov) {
    const others = L.pz.filter((z) => z[0] !== myId);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px Oswald, sans-serif'; ctx.fillStyle = '#f3e9d6'; ctx.fillText('PAUSED', W / 2, H / 2 - 110);
    if (others.length) {
      const names = others.map((z) => (roster.get(z[0]) || { name: '?' }).name);
      const secs = Math.max(...others.map((z) => z[1]));
      ctx.font = '15px "Share Tech Mono", ui-monospace, monospace'; ctx.fillStyle = '#ffd54f';
      ctx.fillText(`${names.join(', ')} ${names.length > 1 ? 'are' : 'is'} picking a perk · ${secs}s`, W / 2, H / 2 - 84);
    }
  }
  if (soloRoom && userPaused && !L.ov) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = 'bold 44px Oswald, sans-serif'; ctx.fillStyle = '#f3e9d6'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '14px "Share Tech Mono", ui-monospace, monospace'; ctx.fillStyle = '#b9a98e'; ctx.fillText('Press Esc to resume', W / 2, H / 2 + 28);
  }

  // downed message
  if (me.dn && !L.ov) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px Oswald, sans-serif'; ctx.fillStyle = '#ff5252'; ctx.fillText('YOU ARE DOWN', W / 2, H / 2 - 70);
    ctx.font = '14px "Share Tech Mono", ui-monospace, monospace'; ctx.fillStyle = '#e0d4c0'; ctx.fillText('A teammate must stand next to you to revive', W / 2, H / 2 - 46);
  }

  // crosshair
  if (!me.dn) {
    const cx = mouse.x, cy = mouse.y, spread = 8 + w.spread * 60;
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, spread, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - spread - 5, cy); ctx.lineTo(cx - spread + 3, cy); ctx.moveTo(cx + spread - 3, cy); ctx.lineTo(cx + spread + 5, cy);
    ctx.moveTo(cx, cy - spread - 5); ctx.lineTo(cx, cy - spread + 3); ctx.moveTo(cx, cy + spread - 3); ctx.lineTo(cx, cy + spread + 5); ctx.stroke();
    if (me.rl) { ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, spread + 6, -Math.PI / 2, -Math.PI / 2 + TAU * me.rl); ctx.stroke(); }
  }
}

// title-screen backdrop
const attract = [];
function drawAttract(t) {
  ctx.drawImage(ground, 900 + Math.sin(t * 0.05) * 200, 900, W / 1.4, H / 1.4, 0, 0, W, H);
  if (attract.length < 26) attract.push({ ti: (Math.random() * 4) | 0, x: rnd(0, W), y: H + 40, a: -Math.PI / 2 + rnd(-0.4, 0.4), s: rnd(25, 70) });
  for (const z of attract) {
    z.x += Math.cos(z.a) * z.s * 0.016; z.y += Math.sin(z.a) * z.s * 0.016;
    if (z.y < -60) { z.y = H + 40; z.x = rnd(0, W); }
    drawEnemy(ctx, z.ti, z.x, z.y, z.a, t, {});
  }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
}
})();

</script>
